name: Verify eat-what FoodRadar integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check foodradar-service.js
          node --check foodradar-packed-turso.js
          node --check foodradar-data-contract.js
      - name: Verify published FoodRadar and eat-what connection
        run: node tests/live-integration.cjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise live eat-what in Chromium
        run: node tests/browser-smoke.cjs
